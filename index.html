  <main class="home-container">

      <svg class="title-art" viewBox="0 0 160 92" role="img" aria-label="大人牽著小孩、手拿福音單張的小插圖">
        <path class="ta-heart" d="M80 22c-5-6-15-4-15 4 0 6 8 11 15 16 7-5 15-10 15-16 0-8-10-10-15-4z"/>
        <circle class="ta-c2" cx="50" cy="40" r="9"/>
        <path class="ta-c2" d="M37 88c0-20 5-34 13-34s13 14 13 34z"/>
        <circle class="ta-c1" cx="106" cy="54" r="7"/>
        <path class="ta-c1" d="M96 88c0-14 4-25 10-25s10 11 10 25z"/>
        <path class="ta-line" d="M61 66c12 6 24 6 37 3" />
        <rect class="ta-book" x="116" y="62" width="20" height="15" rx="3" transform="rotate(-12 126 70)"/>
        <path class="ta-bookline" d="M120 66.5l12-2.5M121 70.5l9-2" transform="rotate(-0 126 70)"/>
      </svg>
      <h1 class="home-title fun-title ft-b" aria-label="兒童家長福音單張"><span class="ft-line" aria-hidden="true"><span class="fc" style="--r:-6deg;--s:1.06;--y:0em">兒<svg class="fd p-left" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="6" r="4.2"/><path d="M5.5 22c0-6.5 2.8-10.5 6.5-10.5s6.5 4 6.5 10.5z"/><path d="M4 13.5l3.5 2M20 13.5l-3.5 2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></span><span class="fc" style="--r:4deg;--s:0.94;--y:-0.06em">童<svg class="fd p-tr" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 21c-1.2-1-9-6.2-9-12a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 5.8-7.8 11-9 12z"/></svg></span><span class="fc" style="--r:-3deg;--s:1.0;--y:0.04em">家</span><span class="fc" style="--r:5deg;--s:1.04;--y:-0.04em">長<svg class="fd p-tr sm" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.5l2.8 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.8 3.3 1.3-6.5-4.9-4.5 6.6-.8z" stroke-linejoin="round"/></svg></span></span><span class="ft-line" aria-hidden="true"><span class="fc" style="--r:-5deg;--s:0.96;--y:0.05em">福<svg class="fd p-left sm2" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9.5" y="2" width="5" height="20" rx="2.2"/><rect x="4" y="7" width="16" height="5" rx="2.2"/></svg></span><span class="fc" style="--r:3deg;--s:1.05;--y:-0.05em">音</span><span class="fc" style="--r:-4deg;--s:0.95;--y:0.03em">單</span><span class="fc" style="--r:6deg;--s:1.03;--y:-0.03em">張<svg class="fd p-right" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 6.5C9 4 5 3.6 1.5 4.6v14c3.5-1 7.5-.6 10.5 1.9 3-2.5 7-2.9 10.5-1.9v-14C19 3.6 15 4 12 6.5z"/><path d="M12 7v13" stroke="#fff" stroke-width="1.6" fill="none"/><path class="lt" d="M10.6 9.6h2.8M12 8.2v5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg></span></span></h1>
      <svg class="title-wave" viewBox="0 0 300 16" aria-hidden="true"><path d="M4 9 Q 22 1 40 9 T 76 9 T 112 9 T 148 9 T 184 9 T 220 9 T 256 9 T 296 9" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
      <figure class="hero-art">
        <img src="img/home_hero.jpg" alt="一家人坐在草地上，一起讀聖經的溫馨插圖" width="1280" height="720">
      </figure>
    </header>

    <section id="tract-grid" class="tract-grid" aria-label="福音單張列表"></section>

    <footer class="home-footer">
      <p><span class="foot-heart">♥</span> 願神賜福您的家庭與兒女 <span class="foot-heart">♥</span></p>
      <nav class="social-links" aria-label="社群連結">
        <a class="social-btn" href="https://www.facebook.com/share/19xRhihEk9/" target="_blank" rel="noopener" aria-label="Facebook" title="Facebook">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.5 21v-7.6h2.6l.4-3h-3V8.5c0-.9.3-1.5 1.5-1.5h1.6V4.3c-.3 0-1.2-.1-2.3-.1-2.3 0-3.9 1.4-3.9 4v2.2H7.8v3h2.6V21z"/></svg>
        </a>
        <a class="social-btn" href="https://www.instagram.com/jloves_children?cplk=NXM1bHM0Y20wMHAx" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.2" cy="6.8" r="1.3"/></svg>
        </a>
      </nav>
    </footer>
  </main>

  <script>
    (function () {
      var FALLBACK_TRACTS = [
        { id: 1, title: '健康甜美的親子關係', verse_ref: '西三20' },
        { id: 2, title: '美好的家庭時光', verse_ref: '徒二46' },
        { id: 3, title: '孩子！這是彎曲悖謬的世代！', verse_ref: '腓二15' },
        { id: 4, title: '優良品格—留給孩子最好的禮物', verse_ref: '提後二21' },
        { id: 5, title: '孩子一生的守護者', verse_ref: '約十29' },
        { id: 6, title: '和諧的夫妻關係—孩子的幸福堡壘', verse_ref: '彼前三7' }
      ];

      var SVG_PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440">' +
        '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0%" stop-color="#f7ded6"/>' +
        '<stop offset="55%" stop-color="#faf1e6"/>' +
        '<stop offset="100%" stop-color="#dcebd9"/>' +
        '</linearGradient></defs>' +
        '<rect width="640" height="440" fill="url(#g)"/>' +
        '<circle cx="140" cy="110" r="90" fill="#f3c5b8" opacity="0.45"/>' +
        '<circle cx="510" cy="340" r="120" fill="#c7dec3" opacity="0.45"/>' +
        '</svg>'
      );

      var grid = document.getElementById('tract-grid');

      function createCard(item) {
        var n = item.id;
        var a = document.createElement('a');
        a.className = 'tract-card';
        a.href = 'play.html?t=' + n;
        a.id = 'tract-card-' + n;

        var thumbWrap = document.createElement('div');
        thumbWrap.className = 'card-thumb-wrap';

        var img = document.createElement('img');
        img.className = 'card-thumb';
        img.alt = item.title;
        img.loading = 'lazy';
        img.src = 'img/thumb_t' + n + '.jpg';
        img.onerror = function () {
          if (img.dataset.triedFront !== '1') {
            img.dataset.triedFront = '1';
            img.src = 'img/t' + n + '_front.jpg';
          } else {
            img.onerror = null;
            img.src = SVG_PLACEHOLDER;
          }
        };

        var numBadge = document.createElement('span');
        numBadge.className = 'card-number';
        numBadge.textContent = String(n);

        var playPill = document.createElement('span');
        playPill.className = 'card-play-pill';
        playPill.textContent = '▶ 觀看動畫';

        thumbWrap.appendChild(img);
        thumbWrap.appendChild(numBadge);
        thumbWrap.appendChild(playPill);

        var body = document.createElement('div');
        body.className = 'card-body';

        var titleEl = document.createElement('h2');
        titleEl.className = 'card-title';
        titleEl.id = 'tract-title-' + n;
        titleEl.textContent = item.title;

        var footer = document.createElement('div');
        footer.className = 'card-footer';

        var refEl = document.createElement('span');
        refEl.className = 'card-ref';
        refEl.id = 'tract-ref-' + n;
        refEl.textContent = item.verse_ref;

        var arrowEl = document.createElement('span');
        arrowEl.className = 'card-arrow';
        arrowEl.textContent = '進入播放 →';

        footer.appendChild(refEl);
        footer.appendChild(arrowEl);

        body.appendChild(titleEl);
        body.appendChild(footer);

        a.appendChild(thumbWrap);
        a.appendChild(body);
        return a;
      }

      FALLBACK_TRACTS.forEach(function (item) {
        grid.appendChild(createCard(item));
      });

      FALLBACK_TRACTS.forEach(function (fallback) {
        var n = fallback.id;
        fetch('data/t' + n + '.json')
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function (data) {
            if (!data || typeof data !== 'object') return;
            var titleEl = document.getElementById('tract-title-' + n);
            var refEl = document.getElementById('tract-ref-' + n);
            if (titleEl && typeof data.title === 'string' && data.title.trim()) {
              titleEl.textContent = data.title.trim();
            }
            var ref = data.verse_ref;
            if ((!ref || !String(ref).trim()) && Array.isArray(data.scenes)) {
              for (var i = 0; i < data.scenes.length; i++) {
                if (data.scenes[i] && data.scenes[i].ref) {
                  ref = data.scenes[i].ref;
                  break;
                }
              }
            }
            if (refEl && typeof ref === 'string' && ref.trim()) {
              refEl.textContent = ref.trim().replace(/^[—－\-]+/, '');
            }
          })
          .catch(function () {
            // Keep hardcoded fallback title and verse_ref
          });
      });
    })();
  </script>
</body>
</html>
