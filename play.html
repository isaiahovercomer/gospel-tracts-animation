<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>兒童家長福音單張動畫版</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="play-body">
 <main class="player-wrap">
  <div id="stage-viewport">
    <div id="stage">
      <div id="scenes-layer"></div>
      <div id="white-overlay"></div>

      <div id="ui-layer">
        <a href="index.html" id="top-home-link" class="top-home-link">← 回首頁</a>

        <div id="start-overlay" class="ui-overlay">
          <button type="button" id="play-btn" class="play-circle-btn" aria-label="播放">
            <span class="play-icon" aria-hidden="true">▶</span>
            <span id="play-btn-label" class="play-label">播放</span>
          </button>
        </div>

        <div id="end-overlay" class="ui-overlay hidden">
          <div class="end-card">
            <div id="end-title" class="end-title">健康甜美的親子關係</div>
            <div class="end-actions">
              <button type="button" id="replay-btn" class="action-btn primary">↻ 再看一次</button>
              <button type="button" id="to-card-btn" class="action-btn secondary">♡ 經文禱告卡</button>
              <a href="index.html" class="action-btn secondary">⌂ 回首頁</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="controls" class="controls" role="group" aria-label="播放控制">
    <button type="button" id="ctrl-play" class="ctrl-play" aria-label="播放">
      <svg class="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.2-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>
      <svg class="ic-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="4" height="14" rx="1.6"/><rect x="13.5" y="5" width="4" height="14" rx="1.6"/></svg>
    </button>
    <span id="ctrl-cur" class="ctrl-time">0:00</span>
    <div id="ctrl-track" class="ctrl-track" role="slider" tabindex="0" aria-label="播放進度" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
      <div class="ctrl-rail"></div>
      <div class="ctrl-ticks"></div>
      <div id="ctrl-fill" class="ctrl-fill"></div>
      <div id="ctrl-thumb" class="ctrl-thumb"></div>
    </div>
    <span id="ctrl-tot" class="ctrl-time">0:00</span>
  </div>
 </main>

 <section id="card-section" class="card-section" aria-label="經文禱告圖文卡">
   <h2 class="card-heading">經文與禱告・圖文卡</h2>
   <p class="card-hint">跟不上影片也沒關係，看著這張卡，再慢慢禱告一次。</p>
   <figure class="card-figure">
     <img id="card-img" class="card-img" alt="經文禱告圖文卡" loading="lazy" width="1080" height="1350">
   </figure>
   <div class="card-actions">
     <a id="card-download" class="pill-btn primary" href="#" download>⬇ 下載圖文卡</a>
     <a href="#" class="pill-btn secondary" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">↑ 回到影片</a>
     <a href="index.html" class="pill-btn secondary">⌂ 回首頁</a>
   </div>
 </section>

  <script src="js/player.js"></script>
</body>
</html>
